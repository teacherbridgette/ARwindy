<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Video Experience</title>
    <!-- A-Frame and MindAR Libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      /* UI Overlay to unlock mobile media permissions */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85); color: #fff;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 9999; text-align: center; padding: 20px; box-sizing: border-box;
      }

      #start-btn {
        background: #007bff; color: white; border: none; padding: 15px 32px;
        font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <!-- User Gesture Overlay (Required for mobile video playback) -->
    <div id="overlay">
      <h2>Classroom AR Scanner</h2>
      <p>Tap below to start camera & enable video playback</p>
      <button id="start-btn">Start AR Camera</button>
    </div>

    <!-- WebAR Scene -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Inline attributes prevent iOS full-screen media takeover -->
        <video id="ar-video" 
               src="./classroom-video.mp4" 
               preload="auto" 
               loop 
               crossorigin="anonymous" 
               playsinline 
               webkit-playsinline 
               muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target setup matching your compiled target image -->
      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('start-btn');
      const target = document.getElementById('target');
      const video = document.getElementById('ar-video');

      // Unlocks video playback buffer on user tap
      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        video.play().then(() => {
          video.pause(); // Warm up video buffer
        }).catch((err) => {
          console.log("Video setup error:", err);
        });
      });

      // Play video when image target is detected
      target.addEventListener('targetFound', () => {
        video.play();
      });

      // Pause video when image target is lost
      target.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
