<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- 1. Point to your targets.mind file -->
    <a-scene mindar-image="imageTargetSrc: YOUR_GLITCH_MIND_FILE_URL_HERE;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- 2. Point to your mp4 video file -->
        <video id="ar-video" src="YOUR_GLITCH_VIDEO_URL_HERE" 
               preload="auto" response-type="arraybuffer" loop 
               crossorigin webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 3. Attach the video plane to the target picture -->
      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
        <a-video src="#ar-video" width="1" height="0.55" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      // 4. Auto-play video when image is detected, pause when lost
      const targetEntity = document.querySelector('#target-entity');
      const video = document.querySelector('#ar-video');

      targetEntity.addEventListener("targetFound", () => {
        video.play();
      });
      targetEntity.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
