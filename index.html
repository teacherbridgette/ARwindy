<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom AR Scanner</title>

    <!-- Stable A-Frame & MindAR CDNs -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      #start-btn {
        padding: 16px 36px;
        font-size: 20px;
        font-weight: bold;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 8px;
        margin-top: 20px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>

    <script>
      AFRAME.registerComponent('ar-video-handler', {
        init: function () {
          var target = this.el;
          var videoSelector = target.getAttribute('data-video');
          this.vid = document.querySelector(videoSelector);

          target.addEventListener('targetFound', function () {
            if (this.vid) {
              this.vid.currentTime = 0;
              // Unmute when image is detected
              this.vid.muted = false;
              var playPromise = this.vid.play();
              if (playPromise !== undefined) {
                playPromise.catch(function(e) {
                  console.log("Playback error: ", e);
                });
              }
            }
          }.bind(this));

          target.addEventListener('targetLost', function() {
            if (this.vid) {
              this.vid.pause();
            }
          }.bind(this));
        }
      });

      function startAR() {
        document.getElementById('overlay').style.display = 'none';
        
        // Unlock all videos for mobile playback
        var videos = document.querySelectorAll('video');
        videos.forEach(function(video) {
          video.muted = false;
          video.play().then(function() {
            video.pause();
          }).catch(function(e) {
            console.log("Preload error:", e);
          });
        });
      }
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <!-- User Interaction Overlay -->
    <div id="overlay">
      <h2>AR Workshop Scanner</h2>
      <p>Tap below to enable camera & sound</p>
      <button id="start-btn" onclick="startAR()">Start Experience</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Videos initialized muted to guarantee mobile autoplay compliance -->
        <video id="v1" src="video1.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        <video id="v2" src="video2.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        <video id="v3" src="video3.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        <video id="v4" src="video4.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 -> Video 1 -->
      <a-entity mindar-image-target="targetIndex: 0" ar-video-handler data-video="#v1">
        <a-video src="#v1" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Target 1 -> Video 2 -->
      <a-entity mindar-image-target="targetIndex: 1" ar-video-handler data-video="#v2">
        <a-video src="#v2" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Target 2 -> Video 3 -->
      <a-entity mindar-image-target="targetIndex: 2" ar-video-handler data-video="#v3">
        <a-video src="#v3" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Target 3 -> Video 4 -->
      <a-entity mindar-image-target="targetIndex: 3" ar-video-handler data-video="#v4">
        <a-video src="#v4" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>
  </body>
</html>
