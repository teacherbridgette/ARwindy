<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4 Target AR Experience with Audio</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      #start-btn {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        margin-top: 15px;
        cursor: pointer;
      }
    </style>

    <script>
      // Component to play/pause video and separate MP3 audio together
      AFRAME.registerComponent('media-handler', {
        init: function () {
          var target = this.el;
          var videoSelector = target.getAttribute('data-video');
          var audioSelector = target.getAttribute('data-audio');

          this.vid = document.querySelector(videoSelector);
          this.aud = document.querySelector(audioSelector);

          target.addEventListener('targetFound', function () {
            if (this.vid) {
              this.vid.currentTime = 0;
              this.vid.play().catch(function(e) { console.log("Video error: ", e); });
            }
            if (this.aud) {
              this.aud.currentTime = 0;
              this.aud.play().catch(function(e) { console.log("Audio error: ", e); });
            }
          }.bind(this));

          target.addEventListener('targetLost', function() {
            if (this.vid) {
              this.vid.pause();
            }
            if (this.aud) {
              this.aud.pause();
            }
          }.bind(this));
        }
      });

      function startAR() {
        document.getElementById('overlay').style.display = 'none';
        
        // Unlock all videos and audio files for iOS/Android media autoplay rules
        var mediaElements = document.querySelectorAll('video, audio');
        mediaElements.forEach(function(media) {
          media.play();
          media.pause();
        });
      }
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <div id="overlay">
      <h2>Classroom AR Scanner</h2>
      <p>Tap below to start the camera and audio</p>
      <button id="start-btn" onclick="startAR()">Start Experience</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets0.mind; ./targets1.mind; ./targets2.mind; ./targets3.mind; maxTrack: 2;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Videos -->
        <video id="v1" src="video1.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="v2" src="video2.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="v3" src="video3.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="v4" src="video4.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>

        <!-- Separate MP3 Audio Files -->
        <audio id="a1" src="audio1.mp3" preload="auto" crossorigin="anonymous"></audio>
        <audio id="a2" src="audio2.mp3" preload="auto" crossorigin="anonymous"></audio>
        <audio id="a3" src="audio3.mp3" preload="auto" crossorigin="anonymous"></audio>
        <audio id="a4" src="audio4.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 -> Video 1 + Audio 1 -->
      <a-entity mindar-image-target="targetIndex: 0" media-handler data-video="#v1" data-audio="#a1">
        <a-video src="#v1" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Target 1 -> Video 2 + Audio 2 -->
      <a-entity mindar-image-target="targetIndex: 1" media-handler data-video="#v2" data-audio="#a2">
        <a-video src="#v2" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Target 2 -> Video 3 + Audio 3 -->
      <a-entity mindar-image-target="targetIndex: 2" media-handler data-video="#v3" data-audio="#a3">
        <a-video src="#v3" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Target 3 -> Video 4 + Audio 4 -->
      <a-entity mindar-image-target="targetIndex: 3" media-handler data-video="#v4" data-audio="#a4">
        <a-video src="#v4" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>
  </body>
</html>
