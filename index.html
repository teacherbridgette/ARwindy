<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Image AR Video</title>

    <!-- MindAR and A-Frame Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      #start-btn {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        margin-top: 15px;
        cursor: pointer;
      }
    </style>

    <script>
      AFRAME.registerComponent('videohandler', {
        init: function () {
          var target = this.el;
          this.vid = document.querySelector("#ar-video");

          target.addEventListener('targetFound', function () {
            if (this.vid) {
              this.vid.play().catch(function(e) {
                console.log("Autoplay issue: ", e);
              });
            }
          }.bind(this));

          target.addEventListener('targetLost', function() {
            if (this.vid) {
              this.vid.pause();
            }
          }.bind(this));
        }
      });

      function startAR() {
        document.getElementById('overlay').style.display = 'none';
        var video = document.querySelector('#ar-video');
        
        // Unlock video playback on mobile devices
        video.play();
        video.pause();
      }
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <!-- Tap-to-Start Screen (Required for iOS/Android video sound) -->
    <div id="overlay">
      <h2>AR Image Scanner</h2>
      <p>Tap below to start the camera</p>
      <button id="start-btn" onclick="startAR()">Start Experience</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video 
          id="ar-video" 
          src="video.mp4" 
          preload="auto" 
          loop 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Index 0 corresponds to targets.mind -->
      <a-entity mindar-image-target="targetIndex: 0" videohandler>
        <a-video 
          src="#ar-video" 
          width="1" 
          height="0.5625" 
          position="0 0 0" 
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>
  </body>
</html>
