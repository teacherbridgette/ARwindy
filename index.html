<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom AR Scanner</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.85); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 99999; font-family: sans-serif; text-align: center;
      }
      button {
        padding: 15px 30px; font-size: 18px; font-weight: bold;
        background: #007bff; color: white; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer;
      }
    </style>

    <script>
      // Automatically load targets0.mind through targets3.mind
      document.addEventListener("DOMContentLoaded", function() {
        var scene = document.querySelector("a-scene");
        var targetPaths = [
          "./targets0.mind",
          "./targets1.mind",
          "./targets2.mind",
          "./targets3.mind"
        ];
        scene.setAttribute("mindar-image", "imageTargetSrc: " + targetPaths.join(";") + "; maxTrack: 2;");
      });

      // Unified media handler component
      AFRAME.registerComponent('media-handler', {
        init: function () {
          var target = this.el;
          var videoSelector = target.getAttribute('data-video');
          var audioSelector = target.getAttribute('data-audio');

          this.vid = document.querySelector(videoSelector);
          this.aud = document.querySelector(audioSelector);

          target.addEventListener('targetFound', function () {
            if (this.vid) { this.vid.currentTime = 0; this.vid.play(); }
            if (this.aud) { this.aud.currentTime = 0; this.aud.play(); }
          }.bind(this));

          target.addEventListener('targetLost', function() {
            if (this.vid) this.vid.pause();
            if (this.aud) this.aud.pause();
          }.bind(this));
        }
      });

      function startAR() {
        document.getElementById('overlay').style.display = 'none';
        
        // Mobile media unlock requirement
        var mediaElements = document.querySelectorAll('video, audio');
        mediaElements.forEach(function(media) {
          media.play().then(function() {
            media.pause();
          }).catch(function(e){ console.log(e); });
        });
      }
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <div id="overlay">
      <h2>Classroom AR Scanner</h2>
      <p>Tap below to start camera & enable sound</p>
      <button onclick="startAR()">Start Camera</button>
    </div>

    <a-scene 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Videos -->
        <video id="v1" src="video1.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="v2" src="video2.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="v3" src="video3.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="v4" src="video4.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>

        <!-- MP3 Audio -->
        <audio id="a1" src="audio1.mp3" preload="auto" crossorigin="anonymous"></audio>
        <audio id="a2" src="audio2.mp3" preload="auto" crossorigin="anonymous"></audio>
        <audio id="a3" src="audio3.mp3" preload="auto" crossorigin="anonymous"></audio>
        <audio id="a4" src="audio4.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 (targets0.mind) -> video1 + audio1 -->
      <a-entity mindar-image-target="targetIndex: 0" media-handler data-video="#v1" data-audio="#a1">
        <a-video src="#v1" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 1 (targets1.mind) -> video2 + audio2 -->
      <a-entity mindar-image-target="targetIndex: 1" media-handler data-video="#v2" data-audio="#a2">
        <a-video src="#v2" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 2 (targets2.mind) -> video3 + audio3 -->
      <a-entity mindar-image-target="targetIndex: 2" media-handler data-video="#v3" data-audio="#a3">
        <a-video src="#v3" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 3 (targets3.mind) -> video4 + audio4 -->
      <a-entity mindar-image-target="targetIndex: 3" media-handler data-video="#v4" data-audio="#a4">
        <a-video src="#v4" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

    </a-scene>
  </body>
</html>
